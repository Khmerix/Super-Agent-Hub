<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUPER AGENT HUB</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <canvas id="bg-canvas"></canvas>
    <div class="vignette"></div>
    <div class="app">
        <header class="hero">
            <div class="hero-badge">SYSTEM ONLINE</div>
            <h1 class="hero-title">
                <span class="glitch" data-text="SUPER">SUPER</span>
                <span class="glitch-accent" data-text="AGENT">AGENT</span>
                <span class="glitch" data-text="HUB">HUB</span>
            </h1>
            <p class="hero-sub">Multi-Agent Orchestration Network // Claude + Perplexity</p>
            <div class="hero-line"></div>
        </header>
        <main class="grid">
            <section class="panel panel-glass agents-panel">
                <div class="panel-header">
                    <div class="panel-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="7" height="7" rx="1"/>
                            <rect x="14" y="3" width="7" height="7" rx="1"/>
                            <rect x="3" y="14" width="7" height="7" rx="1"/>
                            <rect x="14" y="14" width="7" height="7" rx="1"/>
                        </svg>
                    </div>
                    <h2 class="panel-title">Agent Nodes</h2>
                    <div class="panel-glow"></div>
                </div>
                <div id="agent-cards" class="agent-grid">
                    <div class="agent-card ghost">
                        <div class="agent-avatar pulse"></div>
                        <div class="agent-info">
                            <div class="agent-name ghost-line"></div>
                            <div class="agent-desc ghost-line short"></div>
                        </div>
                    </div>
                    <div class="agent-card ghost">
                        <div class="agent-avatar pulse"></div>
                        <div class="agent-info">
                            <div class="agent-name ghost-line"></div>
                            <div class="agent-desc ghost-line short"></div>
                        </div>
                    </div>
                </div>
            </section>
            <section class="panel panel-glass task-panel">
                <div class="panel-header">
                    <div class="panel-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
                        </svg>
                    </div>
                    <h2 class="panel-title">Dispatch Mission</h2>
                    <div class="panel-glow"></div>
                </div>
                <div class="form-group">
                    <label class="form-label">Mission Title</label>
                    <input type="text" id="task-title" class="form-input" placeholder="e.g. BUILD_AUTH_API" autocomplete="off">
                </div>
                <div class="form-group">
                    <label class="form-label">Directive</label>
                    <textarea id="task-desc" class="form-input" rows="4" placeholder="Describe objective: research, code, architecture, debug..."></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group half">
                        <label class="form-label">Priority Level</label>
                        <select id="task-priority" class="form-input">
                            <option value="NORMAL">NORMAL</option>
                            <option value="HIGH">HIGH</option>
                            <option value="CRITICAL">CRITICAL</option>
                            <option value="LOW">LOW</option>
                        </select>
                    </div>
                    <div class="form-group half">
                        <label class="form-label">&nbsp;</label>
                        <button id="btn-submit" class="btn-3d">
                            <span class="btn-face">LAUNCH</span>
                            <span class="btn-side btn-side-l"></span>
                            <span class="btn-side btn-side-r"></span>
                            <span class="btn-side btn-side-b"></span>
                        </button>
                    </div>
                </div>
            </section>
            <section class="panel panel-glass runs-panel">
                <div class="panel-header">
                    <div class="panel-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
                        </svg>
                    </div>
                    <h2 class="panel-title">Mission Log</h2>
                    <div class="panel-glow"></div>
                </div>
                <div id="runs-list" class="runs-list">
                    <div class="run-empty">Awaiting mission dispatch...</div>
                </div>
            </section>
            <section class="panel panel-glass console-panel">
                <div class="panel-header">
                    <div class="panel-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="4 17 10 11 4 5"/>
                            <line x1="12" y1="19" x2="20" y2="19"/>
                        </svg>
                    </div>
                    <h2 class="panel-title">Telemetry Feed</h2>
                    <div class="panel-glow"></div>
                </div>
                <div id="live-log" class="console-log"></div>
                <div class="console-scanline"></div>
            </section>
        </main>
        <footer class="footer">
            <div class="footer-left">SYS.VER.0.1.0 // ORCHESTRATOR ACTIVE</div>
            <div class="footer-right" id="conn-status">
                <span class="dot dot-green"></span> WS CONNECTED
            </div>
        </footer>
    </div>
    <script src="/static/js/main.js"></script>
</body>
</html>
